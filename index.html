<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terra GO School Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'Averta', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-feather": "https://aistudiocdn.com/react-feather@^2.0.10"
      }
    }
    </script>
    <style>
      html {
        font-size: 80%;
      }
      body {
        background-color: #303690; /* Brand Blue */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
        font-family: 'Poppins', 'Averta', sans-serif;
      }
      .phone-frame {
        width: 100%;
        max-width: 390px;
        aspect-ratio: 390 / 844;
        height: auto;
        max-height: 95vh;
        background: #0f172a;
        border-radius: 50px;
        border: 12px solid #0f172a;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255,255,255,0.1);
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 38px;
        overflow: hidden;
        position: relative;
        background-color: #f8fafc; /* Tailwind's bg-slate-50 */
      }
      .phone-screen.dark, .dark .phone-screen {
        background-color: #0b0f19; /* dark slate bg */
      }
      .phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 210px;
        height: 30px;
        background: #0f172a;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        z-index: 1000;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      @keyframes shrinkWidth {
        from { width: 100%; }
        to { width: 0%; }
      }
      .animate-shrink-width {
        animation: shrinkWidth 3s linear forwards;
      }
      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="phone-notch"></div>
        <div id="root"></div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
